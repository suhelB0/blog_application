<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form div {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
<h2>Create Account</h2>

<form th:action="@{/register}" th:object="${user}" method="post">
    <div th:if="${error != null}">
        <i style="color:red" th:text="${error}"></i>
    </div>
    <div>
        <label> Enter name;
            <input type="text" th:field="*{name}" placeholder="Name" required/>
        </label>
    </div>
    <br>
    <div>
        <label> Enter email:
            <input type="email" th:field="*{email}" placeholder="Email" required/>
        </label>
    </div>
    <br>
    <div>
        <label> Enter password:
            <input type="password" th:field="*{password}" placeholder="Password" required/>
        </label>
    </div>
    <br>
    <div>
        <label> Confirm password:
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required/>
        </label>
    </div>
    <br>
    <div>
        <button type="submit">Submit</button>
    </div>
</form>

<div class="link">
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
