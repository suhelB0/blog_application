<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .sidebar {
            width: 220px;
            border-right: 1px solid #ddd;
            padding-right: 10px;
        }

        .main-content {
            flex: 1;
        }

        .filters, .sort, .search {
            margin-bottom: 15px;
        }

        .posts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .post {
            flex: 0 0 48%;
            border: 1px solid #ccc;
            padding: 10px;
            height: 230px;
            box-sizing: border-box;
        }

        .tag-list, .author-list {
            margin-left: 10px;
        }

        form {
            margin-bottom: 10px;
        }

        button {
            margin-top: 5px;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination a {
            text-decoration: none;
            padding: 8px 12px;
            border: 1px solid #ccc;
            margin: 0 5px;
            color: #333;
            border-radius: 4px;
        }

        .pagination a:hover {
            background-color: #eee;
        }
            .pagination a.active {
                background-color: #333;
                color: #fff;
                font-weight: bold;
            }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <form action="/home" method="get">
            <div class="filters">
                <h3>Filter By</h3>

                <input type="hidden" name="search" th:if="${search != null and search != ''}" th:value="${search}">
                <input type="hidden" name="sortField" th:if="${sortField != null and order != null and order != ''}" th:value="${sortField}">
                <input type="hidden" name="order" th:if="${order != null and order != ''}" th:value="${order}">

                <strong>Tags:</strong><br>
                <div class="tag-list" th:each="tag : ${tags}">
                    <label>
                        <input type="checkbox" name="tag"
                               th:value="${tag.name}"
                               th:checked="${param.tag != null and #arrays.contains(param.tag, tag.name)}">
                        <span th:text="${tag.name}"></span>
                    </label><br>
                </div>
                <br>

                <strong>Authors:</strong><br>
                <div class="author-list" th:each="auth : ${allAuthors}">
                    <label>
                        <input type="checkbox" name="author"
                               th:value="${auth.name}"
                               th:checked="${param.author != null and #arrays.contains(param.author, auth.name)}">
                        <span th:text="${auth.name}"></span>
                    </label><br>
                </div>

                <button type="submit">Apply Filters</button>
            </div>
        </form>
    </div>

    <div class="main-content">
        <h1 th:if="${!username.equals('anonymousUser')}" th:text="${username}"></h1>
        <h1>My Blog Application</h1>

        <a th:if="${!role.equals('anonymousUser')}" th:href="@{/newPost}">Add Post</a>

        <form th:if="${role.equals('anonymousUser')}" th:action="@{/login}">
            <button type="submit">Login</button>
        </form>

        <form th:if="${!role.equals('anonymousUser')}" th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>

        <form class="search" action="/home" method="get">
            <input type="text" name="search" placeholder="Search posts..." th:value="${search}">
            <button type="submit">Search</button>
        </form>

        <form class="sort" action="/home" method="get">
            <input type="hidden" name="search" th:if="${search != null and search != ''}" th:value="${search}">
            <div th:if="${param.tag != null}">
                <input type="hidden" name="tag" th:each="t : ${param.tag}" th:value="${t}">
            </div>
            <div th:if="${param.author != null}">
                <input type="hidden" name="author" th:each="a : ${param.author}" th:value="${a}">
            </div>
            <input type="hidden" name="sortField" value="publishedAt">

            <select name="order">
                <option value="" disabled selected>Sort</option>
                <option value="desc" th:selected="${order == 'desc'}">New to Old</option>
                <option value="asc" th:selected="${order == 'asc'}">Old to New</option>
            </select>
            <button type="submit">Sort</button>
        </form>

        <div class="posts-container">
            <div th:each="post : ${posts}" class="post">
                <h3 th:text="${post.title}"></h3>
                <p th:text="${post.user.name + ', ' + #temporals.format(post.publishedAt, 'dd/MMM/yyyy HH:mm')}"></p>
                <p th:text="${post.excerpt}"></p>

                <strong>Tags:</strong>
                <span th:each="tag : ${post.tags}" th:text="${tag.name}"
                      style="background-color: #eee; padding: 2px 5px; margin-right: 5px; border-radius: 3px;">
                </span>
                <br>
                <a th:href="@{'/readPost/' + ${post.id}}">Read More...</a>
            </div>
        </div>

        <div class="pagination">
            <nav>
                <ul style="list-style: none; padding: 0; display: inline-flex; gap: 10px;">

                    <li th:if="${currentPage > 0}">
                        <form method="get" action="/home" style="display: inline;">
                            <input type="hidden" name="start" th:value="${currentPage - 1}">
                            <input type="hidden" name="limit" value="10">
                            <input type="hidden" name="search" th:if="${search != null and search != ''}" th:value="${search}">
                            <input type="hidden" name="sortField" th:if="${sortField != null and sortField != '' and order != null and order != ''}" th:value="${sortField}">
                            <input type="hidden" name="order" th:if="${order != null and order != ''}" th:value="${order}">
                            <div th:if="${param.tag != null}">
                                <input type="hidden" th:each="t : ${param.tag}" name="tag" th:value="${t}">
                            </div>
                            <div th:if="${param.author != null}">
                                <input type="hidden" th:each="a : ${param.author}" name="author" th:value="${a}">
                            </div>
                            <button type="submit" style="background: none; border: none; color: #007bff; cursor: pointer; text-decoration: underline;">
                                &laquo; Previous
                            </button>
                        </form>
                    </li>

                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <form method="get" action="/home" style="display: inline;">
                            <input type="hidden" name="start" th:value="${i}">
                            <input type="hidden" name="limit" value="10">
                            <input type="hidden" name="search" th:if="${search != null and search != ''}" th:value="${search}">
                            <input type="hidden" name="sortField" th:if="${sortField != null and sortField != '' and order != null and order != ''}" th:value="${sortField}">
                            <input type="hidden" name="order" th:if="${order != null and order != ''}" th:value="${order}">
                            <div th:if="${param.tag != null}">
                                <input type="hidden" th:each="t : ${param.tag}" name="tag" th:value="${t}">
                            </div>
                            <div th:if="${param.author != null}">
                                <input type="hidden" th:each="a : ${param.author}" name="author" th:value="${a}">
                            </div>
                            <button type="submit"
                                    th:text="${i + 1}"
                                    th:style="${i == currentPage} ? 'background-color: #007bff; color: white; border: 1px solid #007bff;' : 'background: none; border: 1px solid #ddd; color: #007bff;'"
                                    style="cursor: pointer; padding: 5px 10px; border-radius: 3px; text-decoration: none;">
                            </button>
                        </form>
                    </li>

                    <li th:if="${currentPage < totalPages - 1}">
                        <form method="get" action="/home" style="display: inline;">
                            <input type="hidden" name="start" th:value="${currentPage + 1}">
                            <input type="hidden" name="limit" value="10">
                            <input type="hidden" name="search" th:if="${search != null and search != ''}" th:value="${search}">
                            <input type="hidden" name="sortField" th:if="${sortField != null and sortField != '' and order != null and order != ''}" th:value="${sortField}">
                            <input type="hidden" name="order" th:if="${order != null and order != ''}" th:value="${order}">
                            <div th:if="${param.tag != null}">
                                <input type="hidden" th:each="t : ${param.tag}" name="tag" th:value="${t}">
                            </div>
                            <div th:if="${param.author != null}">
                                <input type="hidden" th:each="a : ${param.author}" name="author" th:value="${a}">
                            </div>
                            <button type="submit" style="background: none; border: none; color: #007bff; cursor: pointer; text-decoration: underline;">
                                Next &raquo;
                            </button>
                        </form>
                    </li>

                </ul>
            </nav>
        </div>

    </div>

</div>

</body>
</html>
