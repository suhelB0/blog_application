<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form div {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <h2>New / Edit post</h2>

    <form th:action="@{/savePost}" th:object="${post}" method="post">
        <div>
            <input type="hidden" th:field="*{id}"/>
        </div>
        <br>
        <div>
            <label> Enter Title:
                <input type="text" th:field="*{title}" placeholder="Enter title" />
            </label>
        </div>
        <br>
        <div>
            <label> Enter Tags:
                <input type="text" name="tag" th:value="${tag}" placeholder="Enter tags (comma separated)" />
            </label>
        </div>
        <br>
        <div>
            <label> Enter Content:
                <textarea th:field="*{content}" placeholder="Enter content" rows="10" cols="50"></textarea>
            </label>
        </div>
        <br>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
