<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Comment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            width: 100%;
            max-width: 500px;
            text-align: left;
            margin-bottom: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Edit Comment</h2>

<form th:action="@{'/updateComment/'+${comment.id}}" th:object="${comment}" method="post">
    <label>Username:
        <input type="text" th:field="*{name}" />
    </label>
    <br><br>
    <label>Email:
        <input type="email" th:field="*{email}" />
    </label>
    <br><br>
    <label>Comment:
        <textarea th:field="*{commentText}" rows="5" cols="40"></textarea>
    </label>
    <br><br>
    <button type="submit">Update Comment</button>
</form>
</body>
</html>
