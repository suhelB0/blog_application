<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        line-height: 1.6;
        text-align: center;
    }

    h2 {
        margin-bottom: 30px;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    form div {
        width: 100%;
        max-width: 600px;
        margin-bottom: 15px;
        text-align: left;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        font-size: 15px;
    }

    a{
        text-decoration: none;
    }

    button {
        margin-top: 10px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 15px;
    }
    </style>
</head>
<body>
<h2>Login</h2>

<form th:action="@{/login}" method="post">
    <div th:if="${param.error}">
        <i style="color: red">Invalid username / password</i>
    </div>
    <div>
        <label> Enter Email:
            <input type="text" name="username" placeholder="Email" />
        </label>
    </div>
    <br>
    <div>
        <label> Enter Password:
            <input type="password" name="password" placeholder="Password" />
        </label>
    </div>
    <br>
    <div>
        <button type="submit">Submit</button>
    </div>
</form>

<div class="link">
    <p>Don't have an account? <a th:href="@{/register}">Create one</a></p>
</div>
</body>
</html>
