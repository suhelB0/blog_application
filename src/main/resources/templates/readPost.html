<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        h3 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            font-size: 18px;
            max-width: 700px;
            line-height: 1.6;
        }

        .button-container{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .blog-post{
            border: 1px solid black;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="blog-post">
        <h3 th:text="${post.title}"></h3>
        <p th:text="${post.user.name +', '+ #temporals.format(post.createdAt, 'dd/MMM/yyyy  HH:mm')}"></p>
        <p th:text="${post.content}"></p>
        <div class="button-container">
            <a th:href="@{'/updatePost/'+${post.id}}">Update</a>
            <a th:href="@{'/deletePost/'+${post.id}}">Delete</a>
        </div>
    </div>

    <div>
        <h2>Comments</h2>
        <div th:each="c : ${post.comments}">
            <p><strong th:text="${c.name}"></strong> (<span th:text="${c.email}"></span>)</p>
            <p th:text="${c.commentText}"></p>
            <a th:href="@{'/editComment/'+${c.id}}">Edit</a> |
            <a th:href="@{'/deleteComment/'+${c.id}}">Delete</a>
            <hr>
        </div>
    </div>

    <div>
        <h2>Write a new comment</h2>
        <form action="#" th:action="@{'/saveComment/'+${post.id}}" th:object="${comment}" method="post">

            <label> Enter Username:
                <input type="text" th:field="*{name}" placeholder="User Name"/>
            </label>
            <br> <br>
            <label> Enter Email:
                <input type="email" th:field="*{email}" placeholder="User Email">
            </label>
            <br> <br>
            <label> Enter comment:
                <textarea th:field="*{commentText}" rows="5" cols="40"></textarea>
            </label>
            <br> <br>
            <button type="submit">Comment</button>
        </form>
    </div>

</body>
</html>
