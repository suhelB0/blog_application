<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Read Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        .blog-post {
            text-align: left;
            margin-bottom: 40px;
        }

        .blog-post h3 {
            text-align: center;
        }

        .blog-post p {
            margin: 10px 0;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        .button-container a {
            margin: 0 10px;
            text-decoration: none;
        }

        div h2 {
            text-align: center;
            margin-top: 40px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        form label {
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }

        form input, form textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="blog-post">
        <h3 th:text="${post.title}"></h3>
        <p th:text="${post.user.name +', '+ #temporals.format(post.publishedAt, 'dd/MMM/yyyy  HH:mm')}"></p>
        <p th:text="${post.content}"></p>
        <div class="button-container">
            <a th:if="${isAdmin or isAuthorOfPost}" th:href="@{'/updatePost/'+${post.id}}">Update</a>
            <a th:if="${isAdmin or isAuthorOfPost}" th:href="@{'/deletePost/'+${post.id}}">Delete</a>
        </div>
    </div>

    <div>
        <h2>Comments</h2>
        <div th:each="c : ${post.comments}">
            <p><strong th:text="${c.name}"></strong> (<span th:text="${c.email}"></span>)</p>
            <p th:text="${c.commentText}"></p>
            <a th:if="${isAdmin or isAuthorOfPost or c.email == currentEmail}" th:href="@{'/editComment/'+${c.id}}">Edit</a>
            <a th:if="${isAdmin or isAuthorOfPost or c.email == currentEmail}" th:href="@{'/deleteComment/'+${c.id}}">Delete</a>
            <hr>
        </div>
    </div>

    <div>
        <h2>Write a new comment</h2>
        <form action="#" th:action="@{'/saveComment/'+${post.id}}" th:object="${comment}" method="post">

            <input type="hidden" th:field="*{id}">

            <div th:if="${!isAuthenticated}">
                <label> Enter Username:
                    <input type="text" th:field="*{name}" placeholder="User Name"/>
                </label>
                <br> <br>
                <label> Enter Email:
                    <input type="email" th:field="*{email}" placeholder="User Email">
                </label>
            </div>
            <br> <br>

            <div th:if="${isAuthenticated}">
                <input type="hidden" name="name" th:value="${currentUsername}" />
                <input type="hidden" name="email" th:value="${currentEmail}" />
            </div>
            <label> Enter comment:
                <textarea th:field="*{commentText}" rows="5" cols="40"></textarea>
            </label>
            <br> <br>
            <button type="submit">Comment</button>
        </form>
    </div>

</body>
</html>
